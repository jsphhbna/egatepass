name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: egatepass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VITE_TURNSTILE_SITE_KEY: '0x4AAAAAAFeETebgPENH6hgH'
      TEST_DATABASE_URL: 'postgres://postgres:postgrespassword@localhost:5432/egatepass_test'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Server & API
        run: npm run typecheck:api

      - name: Typecheck Client & Frontend
        run: npm run typecheck:client

      - name: Test PostgreSQL Migrations (PGlite Chain)
        run: npm run test:migrations

      - name: Run PostgreSQL Concurrency & Recovery Integration Tests
        run: npm run test:integration:postgres

      - name: Run Full Unit & Integration Test Suite
        run: npm run test:unit

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Real Browser IndexedDB Tests
        run: |
          if [ -f tests/e2e/emergency-offline-idb.spec.ts ]; then
            npx playwright test tests/e2e/emergency-offline-idb.spec.ts --project=chromium
          else
            echo "Real browser IndexedDB spec pending parallel completion by Workstream A / E2E Track"
          fi

      - name: Run Real Browser Registration Multi-Step Regression Tests
        env:
          VITE_SUPABASE_URL: 'http://127.0.0.1:54321'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'mock-anon-publishable-key-for-e2e'
        run: npx playwright test tests/e2e/visitor-multistep-registration.spec.ts --project=chromium

      - name: Build Production Frontend & Bundle
        run: npm run build
